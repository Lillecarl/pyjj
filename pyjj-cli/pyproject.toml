[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyjj-cli"
version = "0.1.0"  # independent; pyjj/pyjj-bindings track the jj release
description = "Python CLI for Jujutsu VCS using pyjj bindings"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyjj", "argcomplete>=3", "jinja2>=3"]

[project.optional-dependencies]
# `pyjj arrange` opens pyjjui's arrange screen.
tui = ["pyjjui"]

[project.scripts]
pyjj = "pyjj_cli.__main__:main"
