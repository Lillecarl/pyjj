[workspace]

[package]
name = "pyjj-bindings"
description = "Python bindings for Jujutsu (jj) VCS via PyO3"
version = "0.47.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
homepage = "https://www.jj-vcs.dev/"
repository = "https://github.com/jj-vcs/jj"

[lib]
name = "pyjj_bindings"
crate-type = ["cdylib"]

[dependencies]
# `watchman`, as jj's CLI builds it: `debug watchman` and the
# `fsmonitor.backend = "watchman"` setting need it.
jj-lib = { version = "0.47.1", features = ["git", "watchman"] }
# jj's own gix line, feature for feature. Anything narrower resolves to
# a second gix in the graph, and the copy without `sha1`/`sha256` gives
# `gix-hash` an enum with no variants, which does not compile.
gix = { version = "0.90.0", default-features = false, features = [
    "attributes",
    "auto-chain-error",
    "blob-diff",
    "index",
    "max-performance",
    "sha1",
    "sha256",
] }
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect"] }
pollster = "1.0.1"
# jj's `toml_edit` line (0.25.x), so `ConfigLayer.data` is the same
# `toml_edit::DocumentMut` type on both sides of the call.
toml_edit = "0.25.13"
bstr = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
serde = "1.0.229"
# jj's, for the vendored `source_symbol.rs`.
regex = "1.12.3"
# jj's clock type since 0.47 (`RevsetParseContext::current_time`).
jiff = "0.2"
thiserror = "2.0.17"
futures = "0.3.32"
etcetera = "0.11.0"
# jj's `SecureConfig` takes the rng it would mint a config id with.
# Same version jj pins, so the id format cannot drift.
rand_chacha = "0.10.0"
rand = "0.10.1"
dunce = "1.0.5"
whoami = "2.1.2"
sapling-renderdag = "0.2.0"
