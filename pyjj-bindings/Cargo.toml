[workspace]

[package]
name = "pyjj-bindings"
description = "Python bindings for Jujutsu (jj) VCS via PyO3"
version = "0.43.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
homepage = "https://www.jj-vcs.dev/"
repository = "https://github.com/jj-vcs/jj"

[lib]
name = "pyjj_bindings"
crate-type = ["cdylib"]

[dependencies]
jj-lib = { version = "0.43.0", features = ["git"] }
gix = { version = "0.85.0", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
pollster = "1.0.1"
bstr = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
thiserror = "2.0.17"
futures = "0.3.32"
etcetera = "0.11.0"
dunce = "1.0.5"
whoami = "2.1.2"
