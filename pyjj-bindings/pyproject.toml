[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pyjj-bindings"
description = "Raw PyO3 bindings for Jujutsu VCS"
requires-python = ">=3.11"
version = "0.46.0"
license = { text = "Apache-2.0" }
dependencies = ["anyio>=4"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pyjj_bindings._native"
python-source = "python"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "FA", "BLE", "PLC0415", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio."

[tool.pyrefly]
preset = "strict"
project-includes = ["python"]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
