[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyjjui"
version = "0.1.0"
description = "Textual TUI for Jujutsu VCS, built on pyjj"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyjj", "textual", "anyio"]

[project.scripts]
pyjjui = "pyjjui.__main__:main"

[tool.pytest.ini_options]
anyio_mode = "auto"
